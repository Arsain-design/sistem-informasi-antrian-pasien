<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antrian KL 2 · Anak & Remaja</title>
    <link href="logo-puskesmas.png" rel="icon">

    <!-- ===== STYLES ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ---------- RESET & GLOBAL ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f9ff;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 40px 40px 32px 32px;
            padding: 28px 28px 36px;
            box-shadow: 0 20px 60px -16px rgba(14, 165, 233, 0.18), 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        /* ---------- HEADER ---------- */
        .header-dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .header-left {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
        }

        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left h1 i {
            color: #38bdf8;
            font-size: 1.4rem;
        }

        .badge-klaster {
            background: #38bdf8;
            color: #0c4a6e;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            white-space: nowrap;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .dokter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.12);
            padding: 4px 14px 4px 10px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #0c4a6e;
            border: 1px solid rgba(56, 189, 248, 0.2);
            white-space: nowrap;
        }

        .dokter-tag i {
            font-size: 0.7rem;
            color: #0ea5e9;
        }

        .header-sub {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 20px;
            margin-top: 4px;
            margin-bottom: 14px;
            color: #475569;
            font-size: 0.9rem;
        }

        .header-sub i {
            color: #94a3b8;
            width: 16px;
            text-align: center;
        }

        .header-sub .tanggal {
            color: #64748b;
            font-weight: 500;
        }

        /* ---------- SEARCH BAR ---------- */
        .search-wrapper {
            position: relative;
            margin: 8px 0 18px 0;
        }

        .search-wrapper .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 48px 14px 46px;
            border-radius: 60px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 1rem;
            font-weight: 500;
            color: #0f172a;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            outline: none;
        }

        .search-wrapper input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .search-wrapper input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15), 0 4px 16px rgba(56, 189, 248, 0.08);
        }

        .search-wrapper input:focus+.search-icon {
            color: #0ea5e9;
        }

        .search-wrapper .clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 40px;
            transition: all 0.2s;
            display: none;
        }

        .search-wrapper .clear-btn.visible {
            display: block;
        }

        .search-wrapper .clear-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
        }

        .search-status {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 6px;
            padding-left: 6px;
            min-height: 1.4em;
        }

        .search-status strong {
            color: #0f172a;
            font-weight: 600;
        }

        /* ---------- TABS ---------- */
        .tab-container {
            display: flex;
            gap: 12px;
            margin: 10px 0 4px 0;
            border-bottom: 2px solid rgba(226, 232, 240, 0.6);
            padding-bottom: 2px;
        }

        .tab-btn {
            width: auto;
            padding: 10px 28px;
            border-radius: 40px 40px 0 0;
            background: transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            font-family: inherit;
        }

        .tab-btn:hover {
            background: rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
            color: #1e293b;
        }

        .tab-btn.active {
            background: transparent;
            color: #0ea5e9;
            font-weight: 700;
            border-bottom: 4px solid #38bdf8;
            border-radius: 0;
        }

        .badge-count {
            background: #e2e8f0;
            color: #334155;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 8px;
            transition: all 0.25s;
        }

        .tab-btn.active .badge-count {
            background: #bae6fd;
            color: #0369a1;
        }

        /* ---------- PATIENT LISTS (HORIZONTAL BOX) ---------- */
        .tab-content {
            display: none;
            padding-top: 14px;
        }

        .tab-content.active {
            display: block;
        }

        .horizontal-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* === BOX ONLINE (AON) === */
        .jenis-box.aon-box {
            background: rgba(56, 189, 248, 0.06);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 16px 16px 12px;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            min-height: 120px;
            transition: all 0.2s;
        }

        .jenis-box.aon-box .box-header {
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
        }

        .jenis-box.aon-box .box-header .label .badge-jenis {
            background: rgba(56, 189, 248, 0.15);
            color: #0369a1;
            border-color: rgba(56, 189, 248, 0.3);
        }

        /* === BOX OFFLINE (AOFF) === */
        .jenis-box.aoff-box {
            background: rgba(251, 191, 36, 0.06);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 24px;
            padding: 16px 16px 12px;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            min-height: 120px;
            transition: all 0.2s;
        }

        .jenis-box.aoff-box .box-header {
            border-bottom: 2px solid rgba(251, 191, 36, 0.2);
        }

        .jenis-box.aoff-box .box-header .label .badge-jenis {
            background: rgba(251, 191, 36, 0.15);
            color: #92400e;
            border-color: rgba(251, 191, 36, 0.3);
        }

        .jenis-box .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
        }

        .jenis-box .box-header .label {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jenis-box .box-header .label .badge-jenis {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .jenis-box .box-header .count {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 12px;
            border-radius: 40px;
        }

        .box-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .box-content::-webkit-scrollbar {
            width: 4px;
        }
        .box-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .empty-state-box {
            color: #94a3b8;
            text-align: center;
            padding: 20px 0;
            font-size: 0.85rem;
            font-style: italic;
        }

        /* ---------- PATIENT CARD ---------- */
        .card-antrian {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .card-antrian::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background: #38bdf8;
        }

        .card-antrian:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
            border-color: #bae6fd;
        }

        .card-antrian.called::before {
            background: #94a3b8;
        }

        .card-antrian.called {
            opacity: 0.7;
            background: rgba(255, 255, 255, 0.4);
        }

        .card-antrian .info-left {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 12px;
            flex: 1 1 150px;
        }

        .card-antrian .info-left .nomor {
            font-weight: 700;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .card-antrian .info-left .nama {
            font-weight: 500;
            color: #1e293b;
            font-size: 0.9rem;
        }

        /* Badge jenis di dalam kartu */
        .card-antrian .info-left .badge-jenis-card {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .card-antrian .info-left .badge-jenis-card.aon {
            background: rgba(56, 189, 248, 0.15);
            color: #0369a1;
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card-antrian .info-left .badge-jenis-card.aoff {
            background: rgba(251, 191, 36, 0.15);
            color: #92400e;
            border-color: rgba(251, 191, 36, 0.3);
        }

        /* Durasi tunggu */
        .durasi-tunggu {
            font-size: 0.7rem;
            font-weight: 600;
            color: #4338ca;
            background: rgba(99, 102, 241, 0.08);
            padding: 2px 8px;
            border-radius: 30px;
            white-space: nowrap;
        }

        .card-antrian.called .durasi-tunggu {
            color: #64748b;
            background: rgba(148, 163, 184, 0.15);
        }

        .card-antrian .info-left .waktu {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .card-antrian .info-left .waktu i {
            font-size: 0.65rem;
        }

        .card-antrian .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-panggil {
            width: auto;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 4px 12px -4px rgba(16, 185, 129, 0.3);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-panggil:hover {
            transform: scale(1.04) translateY(-1px);
            box-shadow: 0 8px 18px -6px rgba(16, 185, 129, 0.4);
        }

        .btn-panggil:active {
            transform: scale(0.96);
        }

        .btn-panggil-ulang {
            width: auto;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            box-shadow: 0 4px 12px -4px rgba(245, 158, 11, 0.3);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-panggil-ulang:hover {
            transform: scale(1.04) translateY(-1px);
            box-shadow: 0 8px 18px -6px rgba(245, 158, 11, 0.4);
        }

        .btn-panggil-ulang:active {
            transform: scale(0.96);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .horizontal-box {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .jenis-box {
                min-height: 100px;
            }

            .card-antrian {
                padding: 10px 14px;
            }

            .card-antrian .info-left {
                flex: 1 1 100%;
            }

            .card-antrian .actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media (max-width: 700px) {
            .container {
                padding: 18px 14px 24px;
                border-radius: 28px;
            }

            .header-left h1 {
                font-size: 1.3rem;
            }

            .tab-container {
                gap: 4px;
                overflow-x: auto;
                flex-wrap: nowrap;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            .tab-btn {
                padding: 8px 16px;
                font-size: 0.82rem;
            }

            .search-wrapper input {
                padding: 12px 44px 12px 42px;
                font-size: 0.92rem;
            }

            .btn-panggil,
            .btn-panggil-ulang {
                padding: 4px 12px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 12px 8px;
            }

            .container {
                padding: 14px 10px 18px;
                border-radius: 20px;
            }

            .header-left h1 {
                font-size: 1.1rem;
            }

            .badge-klaster {
                font-size: 0.65rem;
                padding: 2px 10px;
            }

            .dokter-tag {
                font-size: 0.7rem;
                padding: 2px 10px;
            }

            .tab-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .card-antrian .info-left .nomor {
                font-size: 0.85rem;
            }

            .card-antrian .info-left .nama {
                font-size: 0.8rem;
            }

            .jenis-box .box-header .label {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header-dashboard">
            <div class="header-left">
                <h1><i class="fas fa-child"></i> Antrian Klaster 2</h1>
                <span class="badge-klaster">Anak &amp; Remaja</span>
                <span class="dokter-tag" id="dokterTag">
                    <i class="fas fa-user-md"></i>
                    <span id="dokterNama">Memuat...</span>
                </span>
            </div>
        </div>

        <div class="header-sub">
            <span><i class="fas fa-calendar-alt"></i> <span class="tanggal" id="tanggalSekarang">Memuat tanggal...</span></span>
            <span><i class="fas fa-clipboard-list"></i> Total <span id="totalPasien">0</span> pasien</span>
        </div>

        <!-- ===== SEARCH BAR ===== -->
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input
            type="text"
            id="searchInput"
            placeholder="Cari nomor antrian atau nama pasien..."
            autocomplete="off"
            spellcheck="false"
            />
            <button class="clear-btn" id="clearSearchBtn" aria-label="Hapus pencarian">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
        <div class="search-status" id="searchStatus"></div>

        <!-- ===== TABS ===== -->
        <div class="tab-container">
            <button class="tab-btn active" data-tab="waiting" onclick="switchTab('waiting')">
                <i class="fas fa-users"></i> Menunggu
                <span class="badge-count" id="count-waiting">0</span>
            </button>
            <button class="tab-btn" data-tab="called" onclick="switchTab('called')">
                <i class="fas fa-phone"></i> Dipanggil
                <span class="badge-count" id="count-called">0</span>
            </button>
        </div>

        <!-- ===== TAB CONTENT ===== -->
        <div id="tab-waiting" class="tab-content active">
            <div class="horizontal-box" id="daftarWaiting">
                <!-- Box AON -->
                <div class="jenis-box aon-box" id="waitingAON">
                    <div class="box-header">
                        <span class="label"><i class="fas fa-globe" style="color:#0284c7;"></i> Antrian Online <span class="badge-jenis">AON</span></span>
                        <span class="count" id="countWaitingAON">0</span>
                    </div>
                    <div class="box-content" id="listWaitingAON">
                        <div class="empty-state-box">Tidak ada antrian online</div>
                    </div>
                </div>
                <!-- Box AOFF -->
                <div class="jenis-box aoff-box" id="waitingAOFF">
                    <div class="box-header">
                        <span class="label"><i class="fas fa-hospital-user" style="color:#b45309;"></i> Antrian Offline <span class="badge-jenis">AOFF</span></span>
                        <span class="count" id="countWaitingAOFF">0</span>
                    </div>
                    <div class="box-content" id="listWaitingAOFF">
                        <div class="empty-state-box">Tidak ada antrian offline</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-called" class="tab-content">
            <div class="horizontal-box" id="daftarCalled">
                <!-- Box AON Called -->
                <div class="jenis-box aon-box" id="calledAON">
                    <div class="box-header">
                        <span class="label"><i class="fas fa-globe" style="color:#0284c7;"></i> Antrian Online <span class="badge-jenis">AON</span></span>
                        <span class="count" id="countCalledAON">0</span>
                    </div>
                    <div class="box-content" id="listCalledAON">
                        <div class="empty-state-box">Tidak ada panggilan online</div>
                    </div>
                </div>
                <!-- Box AOFF Called -->
                <div class="jenis-box aoff-box" id="calledAOFF">
                    <div class="box-header">
                        <span class="label"><i class="fas fa-hospital-user" style="color:#b45309;"></i> Antrian Offline <span class="badge-jenis">AOFF</span></span>
                        <span class="count" id="countCalledAOFF">0</span>
                    </div>
                    <div class="box-content" id="listCalledAOFF">
                        <div class="empty-state-box">Tidak ada panggilan offline</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== FIREBASE ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        // ================================================================
        //  1.  FIREBASE KONFIGURASI & INISIALISASI
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB-nAMpSMXfomAxtq5Ntebv0IYOmuKitj0",
            authDomain: "sistem-antrian-puskesmas.firebaseapp.com",
            databaseURL: "https://sistem-antrian-puskesmas-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sistem-antrian-puskesmas",
            storageBucket: "sistem-antrian-puskesmas.firebasestorage.app",
            messagingSenderId: "727104534075",
            appId: "1:727104534075:web:9814d1598c9f846e050e1e"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ================================================================
        //  2.  KONSTANTA & STATE
        // ================================================================
        const KLASTER = 'K2';
        let allPatients = [];
        let searchTerm = '';
        let currentTab = 'waiting';

        // DOM refs
        const $ = (id) => document.getElementById(id);
        const searchInput = $('searchInput');
        const clearBtn = $('clearSearchBtn');
        const searchStatus = $('searchStatus');
        const totalPasien = $('totalPasien');
        const dokterNama = $('dokterNama');
        const tanggalSekarang = $('tanggalSekarang');
        const countWaiting = $('count-waiting');
        const countCalled = $('count-called');

        // ================================================================
        //  3.  FUNGSI UTILITY
        // ================================================================
        function formatTime(ts) {
            if (!ts) return '—';
            try { return new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }); } catch { return '—'; }
        }

        function formatDurasi(ms) {
            if (!ms || ms < 0) return '—';
            const seconds = Math.floor(ms / 1000);
            if (seconds < 60) return 'baru saja';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} menit`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} jam`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} hari`;
            const weeks = Math.floor(days / 7);
            return `${weeks} minggu`;
        }

        function updateTanggal() {
            try {
                const now = new Date();
                const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                tanggalSekarang.textContent = now.toLocaleDateString('id-ID', opts);
            } catch {
                tanggalSekarang.textContent = '—';
            }
        }

        // ================================================================
        //  4.  FUNGSI DOKTER
        // ================================================================
        function loadDokter() {
            database.ref('dokter_assignments/' + KLASTER).once('value')
                .then(snap => {
                    dokterNama.textContent = snap.val() || 'Belum ditentukan';
                })
                .catch(() => {
                    dokterNama.textContent = 'Gagal memuat';
                });
        }

        // ================================================================
        //  5.  RENDER UTAMA — dengan filter pencarian & pisahkan AON/AOFF
        // ================================================================
        function render() {
            const term = searchTerm.trim().toLowerCase();

            const waitingList = allPatients.filter(p => p.status === 'waiting');
            const calledList = allPatients.filter(p => p.status === 'called');

            // Total pasien yang sudah check in (waiting + called) — tidak terpengaruh filter
            const totalCheckin = waitingList.length + calledList.length;
            totalPasien.textContent = totalCheckin;

            const filterFn = (p) => {
                if (!term) return true;
                const nomor = String(p.nomor_antrian || '').toLowerCase();
                const nama = String(p.nama_pasien || '').toLowerCase();
                const jenis = String(p.jenis_antrian || '').toLowerCase();
                return nomor.includes(term) || nama.includes(term) || jenis.includes(term);
            };

            const filteredWaiting = waitingList.filter(filterFn);
            const filteredCalled = calledList.filter(filterFn);

            // Pisahkan berdasarkan jenis antrian
            const waitingAON = filteredWaiting.filter(p => p.jenis_antrian === 'AON' || !p.jenis_antrian);
            const waitingAOFF = filteredWaiting.filter(p => p.jenis_antrian === 'AOFF');
            const calledAON = filteredCalled.filter(p => p.jenis_antrian === 'AON' || !p.jenis_antrian);
            const calledAOFF = filteredCalled.filter(p => p.jenis_antrian === 'AOFF');

            // Render ke box masing-masing
            renderBox('listWaitingAON', waitingAON, 'waiting', 'AON');
            renderBox('listWaitingAOFF', waitingAOFF, 'waiting', 'AOFF');
            renderBox('listCalledAON', calledAON, 'called', 'AON');
            renderBox('listCalledAOFF', calledAOFF, 'called', 'AOFF');

            // Update count badge di header box
            $('countWaitingAON').textContent = waitingAON.length;
            $('countWaitingAOFF').textContent = waitingAOFF.length;
            $('countCalledAON').textContent = calledAON.length;
            $('countCalledAOFF').textContent = calledAOFF.length;

            // Update total badge tab
            countWaiting.textContent = filteredWaiting.length;
            countCalled.textContent = filteredCalled.length;

            // Search status
            if (term) {
                const totalMatch = filteredWaiting.length + filteredCalled.length;
                searchStatus.innerHTML =
                    `<i class="fas fa-search" style="color:#38bdf8;margin-right:6px;"></i> Menampilkan <strong>${totalMatch}</strong> hasil untuk "<strong>${term}</strong>"`;
            } else {
                searchStatus.innerHTML = '';
            }

            clearBtn.classList.toggle('visible', term.length > 0);
        }

        // ================================================================
        //  6.  RENDER SATU BOX (AON atau AOFF) — dengan durasi tunggu & waktu check-in
        // ================================================================
        function renderBox(containerId, items, status, jenis) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (items.length === 0) {
                const msg = (status === 'waiting') ?
                    'Tidak ada antrian ' + (jenis === 'AON' ? 'online' : 'offline') :
                    'Tidak ada panggilan ' + (jenis === 'AON' ? 'online' : 'offline');
                container.innerHTML = `<div class="empty-state-box">${msg}</div>`;
                return;
            }

            let html = '';
            const now = Date.now();

            for (const p of items) {
                const isCalled = (p.status === 'called');
                const waktuDaftar = p.waktu_daftar || 0;
                const waktuPanggil = p.waktu_panggil || 0;
                const waktuCheckin = p.waktu_checkin || 0;

                // Tentukan waktu acuan untuk durasi
                let durasiMs = 0;
                if (isCalled) {
                    durasiMs = waktuPanggil ? now - waktuPanggil : 0;
                } else {
                    // waiting: prioritaskan waktu_checkin, fallback ke waktu_daftar
                    const startTime = waktuCheckin || waktuDaftar || 0;
                    durasiMs = startTime ? now - startTime : 0;
                }
                const durasiStr = formatDurasi(durasiMs);

                // Waktu tampilan: untuk waiting gunakan waktu check-in jika ada, fallback ke waktu daftar
                const waktuTampil = isCalled ? waktuPanggil : (waktuCheckin || waktuDaftar);
                const waktuLabel = '🕐 ' + formatTime(waktuTampil);
                const waktuIcon = isCalled ? 'fa-clock' : 'fa-hourglass-start';

                const badgeClass = (p.jenis_antrian === 'AOFF') ? 'aoff' : 'aon';

                const btnHTML = isCalled ?
                    `<button class="btn-panggil-ulang" data-id="${p.id}" data-nama="${p.nama_pasien}" data-nomor="${p.nomor_antrian}">
                                <i class="fas fa-rotate-right"></i> Ulangi
                            </button>` :
                    `<button class="btn-panggil" data-id="${p.id}" data-nama="${p.nama_pasien}" data-nomor="${p.nomor_antrian}">
                                <i class="fas fa-bullhorn"></i> Panggil
                            </button>`;

                const cardClass = isCalled ? 'card-antrian called' : 'card-antrian';

                html += `
                            <div class="${cardClass}">
                                <div class="info-left">
                                    <span class="nomor">${p.nomor_antrian}</span>
                                    <span class="nama">${p.nama_pasien}</span>
                                    <span class="badge-jenis-card ${badgeClass}">${p.jenis_antrian}</span>
                                    <span class="waktu"><i class="fas ${waktuIcon}"></i> ${waktuLabel}</span>
                                    <span class="durasi-tunggu">⏱ ${durasiStr}</span>
                                </div>
                                <div class="actions">
                                    ${btnHTML}
                                </div>
                            </div>
                        `;
            }

            container.innerHTML = html;

            // Event listener untuk tombol panggil
            container.querySelectorAll('.btn-panggil, .btn-panggil-ulang').forEach(btn => {
                btn.addEventListener('click', handlePanggilClick);
            });
        }

        // ================================================================
        //  7.  HANDLER PANGGIL / PANGGIL ULANG
        // ================================================================
        async function handlePanggilClick(e) {
            const btn = e.currentTarget;
            const id = btn.dataset.id;
            const nama = btn.dataset.nama;
            const nomor = btn.dataset.nomor;
            const isUlang = btn.classList.contains('btn-panggil-ulang');

            const action = isUlang ? 'panggil ULANG' : 'panggil';
            const confirmMsg = isUlang ?
                `Panggil ULANG ${nama} (${nomor}) ?\nPasien akan muncul kembali di layar TV.` :
                `Panggil ${nama} (${nomor}) ?`;

            if (!confirm(confirmMsg)) return;

            try {
                await database.ref('antrians/' + id).update({
                    status: 'called',
                    waktu_panggil: Date.now()
                });
                alert(`✅ ${nomor} - ${nama} berhasil di${action}!`);
            } catch (err) {
                alert('❌ Gagal: ' + err.message);
            }
        }

        // ================================================================
        //  8.  FIREBASE LISTENER — data antrian
        // ================================================================
        database.ref('antrians').on('value', (snapshot) => {
            const raw = [];
            snapshot.forEach((child) => {
                const data = child.val();
                if (data.klaster !== KLASTER) return;
                raw.push({
                    id: child.key,
                    nomor_antrian: data.nomor_antrian || '—',
                    nama_pasien: data.nama_pasien || '—',
                    status: data.status || 'waiting',
                    jenis_antrian: data.jenis_antrian || 'AON',
                    waktu_panggil: data.waktu_panggil || 0,
                    waktu_daftar: data.waktu_daftar || 0,
                    waktu_checkin: data.waktu_checkin || 0,   // ambil waktu check in
                });
            });
            raw.sort((a, b) => {
                if (a.status === b.status) {
                    return (String(a.nomor_antrian) || '').localeCompare(String(b.nomor_antrian) || '');
                }
                return a.status === 'waiting' ? -1 : 1;
            });

            allPatients = raw;
            render();
        });

        // ================================================================
        //  9.  FIREBASE LISTENER — dokter assignment
        // ================================================================
        database.ref('dokter_assignments/' + KLASTER).on('value', (snap) => {
            dokterNama.textContent = snap.val() || 'Belum ditentukan';
        });

        // ================================================================
        //  10. TAB SWITCHING
        // ================================================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');

            render();
        }

        // ================================================================
        //  11. SEARCH
        // ================================================================
        searchInput.addEventListener('input', function() {
            searchTerm = this.value;
            render();
        });

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            searchTerm = '';
            render();
            searchInput.focus();
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchTerm = '';
                render();
                searchInput.blur();
            }
        });

        // ================================================================
        //  12. UPDATE DURASI SECARA REAL-TIME (setiap 5 detik)
        // ================================================================
        setInterval(() => {
            // Render ulang tanpa mengambil data baru, hanya perbarui durasi
            render();
        }, 5000);

        // ================================================================
        //  13. INISIALISASI
        // ================================================================
        updateTanggal();
        loadDokter();

        console.log(`🖥️ Dashboard ${KLASTER} siap · durasi tunggu real-time diperbarui setiap 5 detik.`);
    </script>

</body>
</html>
